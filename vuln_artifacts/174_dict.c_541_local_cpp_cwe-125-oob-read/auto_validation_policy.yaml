validation:
  exception_detectors:
    HASH_COLLISION:
      constant_return_regex: \breturn\s+(0|1|2|3|0x[0-9a-fA-F]+|[A-Z_]+)\s*;
      constant_return_value: '1'
      forbid_constants:
      - '0'
      symbols: []
  exceptions_by_rule:
    oob-read:
    - HASH_COLLISION
    - MEMCMP_STEER
  exceptions_by_spec: {}
  external_stub_allowlist:
  - malloc
  - calloc
  - realloc
  - free
  - memcpy
  - memmove
  - memset
  - memcmp
  - strlen
  - strnlen
  - strcmp
  - strncmp
  - strchr
  - strrchr
  - open
  - close
  - read
  - write
  - lseek
  - fopen
  - fclose
  - fread
  - fwrite
  - fflush
  - fseek
  - ftell
  - getenv
  - setenv
  - unsetenv
  - time
  - clock_gettime
  - abort
  - exit
  - socket
  - connect
  - accept
  - bind
  - listen
  - recv
  - send
  - pthread_create
  - pthread_join
  - pthread_mutex_init
  - pthread_mutex_lock
  - pthread_mutex_unlock
  hash_function_names: []
  semantic_stub_denylist:
  - ALWAYS_TRUE
  - ALWAYS_FALSE
  - ALWAYS_NULL
  - CONSTANT_RETURN
  - HASH_COLLISION
  - MEMCMP_STEER
