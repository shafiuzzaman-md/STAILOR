rules:
  - id: local.oob.memfunc.length-misuse
    strategy: memcall-near-line
    funcs: [ memcpy, memmove, memset, memcmp, bcmp ]
    window_lines: 8
    # For reads/writes, ensure LEN bytes from DEST are in-bounds.
    snippet: |
      __llmse_rule_assert( klee_is_valid_ptr((void*)({DEST}), (size_t)({LEN})) )

  # optional fallback if a rule id doesn't match
  - id: .*
    strategy: literal
    window_lines: 0
    snippet: |
      __llmse_rule_assert(1)
